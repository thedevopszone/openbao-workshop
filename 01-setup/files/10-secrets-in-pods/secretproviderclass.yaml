# secretproviderclass.yaml — CSI Secrets Store: OpenBao-Secret als Volume.
# Begleitend zu 10-secrets-in-pods.md.
#
# Voraussetzung:
#   - secrets-store-csi-driver + Vault-CSI-Provider installiert (siehe Kapitel)
#   - kubernetes-Auth-Rolle "demo-app" + ServiceAccount "demo-app"
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: openbao-workshop
  namespace: default
spec:
  provider: vault
  parameters:
    vaultAddress: "http://openbao.openbao.svc:8200"
    roleName: "demo-app"                 # kubernetes-Auth-Rolle
    objects: |
      - objectName: "message"
        secretPath: "kv/data/workshop/hello"
        secretKey: "message"
---
apiVersion: v1
kind: Pod
metadata:
  name: csi-demo
  namespace: default
spec:
  serviceAccountName: demo-app
  containers:
    - name: app
      image: busybox:1.36
      command: ["/bin/sh", "-c", "cat /mnt/secrets/message; sleep 3600"]
      volumeMounts:
        - name: secrets
          mountPath: /mnt/secrets
          readOnly: true
  volumes:
    - name: secrets
      csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: openbao-workshop
