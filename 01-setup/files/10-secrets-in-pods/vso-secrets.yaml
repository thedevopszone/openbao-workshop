# vso-secrets.yaml — Vault Secrets Operator (CRD-basiert) gegen OpenBao.
# Begleitend zu 10-secrets-in-pods.md.
#
# Voraussetzung: VSO installiert; kubernetes-Auth-Rolle "demo-app".
# VSO ist HashiCorps Operator und spricht OpenBao über die API-Kompatibilität
# (wie der hashicorp/vault-Provider) — gegen eure Versionen testen.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: openbao
  namespace: default
spec:
  address: "http://openbao.openbao.svc:8200"
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: demo-app
  namespace: default
spec:
  vaultConnectionRef: openbao
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: demo-app
    serviceAccount: demo-app
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: app-config
  namespace: default
spec:
  vaultAuthRef: demo-app
  mount: kv
  type: kv-v2
  path: workshop/hello
  destination:
    name: app-config        # erzeugtes K8s-Secret
    create: true
  refreshAfter: 30s
