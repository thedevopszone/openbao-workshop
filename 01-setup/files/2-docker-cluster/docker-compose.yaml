      - "8202:8200"          # Host 8202 → bao-3 API
    cap_add:
      - IPC_LOCK
    volumes:
      - ./config/bao-3.hcl:/openbao/config/bao.hcl:ro
      - ./data/bao-3:/openbao/data
    environment:
      - BAO_ADDR=http://127.0.0.1:8200
    command: server -config=/openbao/config/bao.hcl
    restart: unless-stopped