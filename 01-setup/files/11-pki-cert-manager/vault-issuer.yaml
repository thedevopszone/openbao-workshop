# vault-issuer.yaml — cert-manager ClusterIssuer auf OpenBao-PKI.
# Begleitend zu 11-pki-cert-manager.md.
#
# Auth per kubernetes-Methode (kein hinterlegtes Geheimnis). Alternativen:
# auth.tokenSecretRef (statischer Token) oder auth.appRole.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: openbao-pki
spec:
  vault:
    server: "http://openbao.openbao.svc:8200"
    path: "pki/sign/web"          # Sign-Pfad der PKI-Rolle "web"
    auth:
      kubernetes:
        role: certmanager          # OpenBao-Rolle aus setup-pki-certmanager.sh
        mountPath: /v1/auth/kubernetes
        serviceAccountRef:
          name: cert-manager       # cert-managers eigener ServiceAccount
