server:
  image:                     # OpenBao-Version pinnen (reproduzierbares Setup)
    registry: quay.io
    repository: openbao/openbao
    tag: "2.5.4"
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true      # node_id je Pod automatisch setzen
ui:
  enabled: true            # erzeugt den Service "openbao-ui" + schaltet die UI frei